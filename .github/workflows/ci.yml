name: CI

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CI: "true"

jobs:
    build-and-test:
        name: Build, unit tests, and coverage
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      src-electron/package-lock.json
            - name: Verify release version and notes
              if: startsWith(github.ref, 'refs/tags/')
              run: node scripts/verify-release-version.mjs
            - name: Install dependencies
              run: npm ci
            - name: Install Electron workspace dependencies
              run: npm ci --prefix src-electron
            - name: Typecheck
              run: npm run typecheck
            - name: Unit tests with NYC coverage reports
              id: coverage
              run: npm run test:coverage
            - name: Write coverage to the workflow summary
              if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' && hashFiles('coverage/coverage-summary.json') != '' }}
              run: node scripts/report-coverage.mjs
            - name: Upload coverage reports
              if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
              uses: actions/upload-artifact@v7
              with:
                  name: unit-coverage
                  path: coverage/
                  if-no-files-found: warn
                  retention-days: 14
            - name: Build browser application
              run: npm run build
            - name: Build Electron application
              run: npm run build:electron:dir
            - name: Upload browser build
              uses: actions/upload-artifact@v7
              with:
                  name: browser-build
                  path: dist/spa/
                  if-no-files-found: error
                  retention-days: 7

    coverage-badge:
        name: Publish coverage percentage badge
        needs: build-and-test
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: true # Required only for pushing the badge branch.
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  package-manager-cache: false
            - uses: actions/download-artifact@v8
              with:
                  name: unit-coverage
                  path: coverage/
            - name: Update the coverage-badge branch
              run: node scripts/publish-coverage-badge.mjs

    electron-e2e:
        name: Electron E2E tests
        runs-on: macos-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      src-electron/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Install Electron workspace dependencies
              run: npm ci --prefix src-electron
            - name: Build Electron and run Playwright
              run: npm run test:e2e
            - name: Upload Playwright screenshots and failure traces
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: electron-test-results
                  path: test-results/
                  if-no-files-found: ignore
                  retention-days: 14

    desktop-packages:
        name: Package ${{ matrix.platform }} (${{ matrix.arch }})
        needs: [build-and-test, electron-e2e]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                      arch: x64
                      extension: tar.gz
                    - os: windows-latest
                      platform: win32
                      arch: x64
                      extension: zip
                    - os: macos-latest
                      platform: darwin
                      arch: arm64
                      extension: tar.gz
                    - os: macos-latest
                      platform: darwin
                      arch: x64
                      extension: tar.gz
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      src-electron/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Install Electron workspace dependencies
              run: npm ci --prefix src-electron
            - name: Package desktop application
              run: npm run build:electron -- --target ${{ matrix.platform }} --arch ${{ matrix.arch }}
            - name: Archive macOS or Linux application
              if: runner.os != 'Windows'
              run: >-
                  tar -czf "dist/electron/budget-pro-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
                  -C dist/electron/Packaged "Budget Pro-${{ matrix.platform }}-${{ matrix.arch }}"
            - name: Archive Windows application
              if: runner.os == 'Windows'
              shell: pwsh
              run: >-
                  Compress-Archive
                  -LiteralPath "dist/electron/Packaged/Budget Pro-${{ matrix.platform }}-${{ matrix.arch }}"
                  -DestinationPath "dist/electron/budget-pro-${{ matrix.platform }}-${{ matrix.arch }}.zip"
            - name: Upload desktop application
              uses: actions/upload-artifact@v7
              with:
                  path: dist/electron/budget-pro-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 30

    release:
        name: Publish GitHub release
        needs: desktop-packages
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Verify release metadata
              run: node scripts/verify-release-version.mjs
            - uses: actions/download-artifact@v8
              with:
                  pattern: budget-pro-*
                  merge-multiple: true
                  path: release-assets/
            - name: Verify all desktop downloads are present
              run: |
                  node --input-type=module <<'NODE'
                  import { readdirSync, statSync } from 'node:fs';
                  const expected = [
                      'budget-pro-darwin-arm64.tar.gz',
                      'budget-pro-darwin-x64.tar.gz',
                      'budget-pro-linux-x64.tar.gz',
                      'budget-pro-win32-x64.zip'
                  ];
                  const actual = readdirSync('release-assets').sort();
                  if (JSON.stringify(actual) !== JSON.stringify(expected.sort())) {
                      throw new Error(`Incomplete release assets: ${actual.join(', ')}`);
                  }
                  for (const file of expected) {
                      const entry = statSync(`release-assets/${file}`);
                      if (!entry.isFile() || entry.size === 0) throw new Error(`Invalid asset: ${file}`);
                  }
                  NODE
            - name: Generate archive checksums
              working-directory: release-assets
              run: sha256sum budget-pro-* > SHA256SUMS.txt
            - name: Upload assets and publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  version="$(node -p "require('./package.json').version")"
                  prerelease=false
                  latest=true
                  if [[ "$version" == *-* ]]; then
                      prerelease=true
                      latest=false
                  fi
                  if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
                      if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != "true" ]]; then
                          echo "Release $GITHUB_REF_NAME is already published; refusing to overwrite it."
                          exit 1
                      fi
                  else
                      gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
                          --prerelease="$prerelease" --title "Budget Pro $version" \
                          --notes-file "docs/releases/$version.md"
                  fi
                  gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
                  gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease" --latest="$latest"
                  gh release view "$GITHUB_REF_NAME" --json url --jq .url
